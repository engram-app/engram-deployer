name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, linux, x64, isolated]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (-race)
        run: go test -race -timeout 60s ./...

      - name: Validate plugin manifest XML
        run: |
          # XML comments may not contain '--'. Easy to introduce by
          # accident in a code-example block, breaks Unraid's plugin
          # parser silently.
          xmllint --noout package/engram-deployer.plg

      - name: Build Slackware .txz (smoke)
        run: bash package/build-package.sh 0.0.0-ci

      - name: Assert package entries are uid=0/gid=0
        # Belt to the build-package.sh --owner=0 suspenders. installpkg
        # normalizes ownership during extraction, but a tarball stamped
        # with the build runner's UID would chown `/` itself if anyone
        # ever bypassed installpkg with raw `tar -xJf -C /` (which is
        # exactly how the v0.1.2 install bug happened).
        run: |
          tar -tvJf dist/engram-deployer-0.0.0-ci-x86_64-1.txz | \
            awk '$2 != "0/0" { print "BAD:", $0; bad++ } END { if (bad>0) { print bad" entries not owned by 0/0"; exit 1 } }'

      - name: Assert package contains Slackware metadata at anchored paths
        # installpkg detects metadata via `tar --transform 's,^install/,..,'`
        # — that anchor doesn't match `./install/...`. A leading `./` on
        # ANY entry means doinst.sh never runs and slack-desc is never
        # parsed (cost us v0.1.3). Assert both shape (anchored, no `./`)
        # and presence (the two metadata files exist).
        run: |
          tar -tJf dist/engram-deployer-0.0.0-ci-x86_64-1.txz | \
            awk '/^\.\// { bad++ } END { if (bad>0) { print bad" entries have ./ prefix — installpkg will not detect install/ metadata"; exit 1 } }'
          tar -tJf dist/engram-deployer-0.0.0-ci-x86_64-1.txz | \
            grep -qE '^install/slack-desc$' || { echo "missing install/slack-desc (must be anchored, no leading ./)"; exit 1; }
          tar -tJf dist/engram-deployer-0.0.0-ci-x86_64-1.txz | \
            grep -qE '^install/doinst.sh$' || { echo "missing install/doinst.sh (must be anchored, no leading ./)"; exit 1; }
